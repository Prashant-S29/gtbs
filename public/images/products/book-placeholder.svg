<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">GTBS book cover placeholder</title>
  <desc id="desc">A neutral illustrated book cover used when a product cover is unavailable.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="32" fill="url(#background)"/>
  <rect x="115" y="130" width="370" height="510" rx="24" fill="#fff" stroke="#ea580c" stroke-width="12"/>
  <path d="M300 130v510M145 205h120M335 205h120" fill="none" stroke="#fdba74" stroke-linecap="round" stroke-width="12"/>
  <circle cx="300" cy="350" r="74" fill="#fff7ed" stroke="#f97316" stroke-width="10"/>
  <path d="M266 350h68M300 316v68" stroke="#ea580c" stroke-linecap="round" stroke-width="12"/>
